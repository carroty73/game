server {
    listen 80;
    listen [::]:80;
    server_name game.carroty.com;

    # 루트는 app 폴더 전체다(갤러그 그림과 웹 버전을 ../galaga/ 로 가져오기 때문)
    root /home/oyee/webapps/app;

    # 첫 화면은 games/index.html
    location = / {
        try_files /games/index.html =404;
    }

    # 점(.)으로 시작하는 파일/폴더(.git, .env 등)는 외부에서 접근 금지
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 문서/설정 파일은 외부에서 접근 금지
    location ~* \.(md|ya?ml)$ {
        deny all;
    }

    # 서버 프로그램 폴더와 비공개 자료는 막는다
    location ~ ^/(hot|map|money|company|hello2|_tools)/ {
        deny all;
    }
    location ^~ /water/private/ {
        deny all;
    }

    # 방문자 카운터(counter.py, 포트 8004): POST면 세고 GET이면 숫자만 돌려준다
    location = /count {
        proxy_pass http://127.0.0.1:8004/hit;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 빌드 묶음은 캐시하지 않는다
    location ~* \.(apk|tar\.gz)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
